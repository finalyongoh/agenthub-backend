    # Temporary AgentHub HTTP server for first certbot issuance.
    server {
        listen 80;
        server_name agenthub.wolyong.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 200 'agenthub certbot ready'; add_header Content-Type text/plain; }
    }
