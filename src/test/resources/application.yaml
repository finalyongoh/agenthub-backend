spring:
  datasource:
    url: jdbc:h2:mem:agenthub-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      repositories:
        enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

agenthub:
  auth:
    jwt:
      issuer: agenthub-test
      access-token-ttl: 1h
      secret: test-jwt-secret-test-jwt-secret-test-jwt-secret

github:
  sync:
    enabled: false
