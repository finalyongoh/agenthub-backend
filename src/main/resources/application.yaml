spring:
  application:
    name: agenthub

  # PostgreSQL 연동 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/agenthub
    username: agenthub_user
    password: agenthub_password
    driver-class-name: org.postgresql.Driver

  # JPA 설정 (개발 초기에는 테이블 자동 생성을 위해 update 권장)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis 연동 설정
  data:
    redis:
      host: localhost
      port: 6379