spring:
  config:
    import: optional:file:.env.local[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  application:
    name: agenthub

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # PostgreSQL 연동 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/agenthub
    username: agenthub_user
    password: agenthub_password
    driver-class-name: org.postgresql.Driver

  # JPA 설정 (개발 초기에는 테이블 자동 생성을 위해 update 권장)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # Redis 연동 설정
  data:
    redis:
      host: localhost
      port: 6379

agenthub:
  frontend:
    base-url: ${AGENTHUB_FRONTEND_BASE_URL:http://localhost:5173}
  images:
    directory: "${AGENTHUB_IMAGE_DIRECTORY:img}"
  auth:
    jwt:
      issuer: agenthub
      access-token-ttl: 1h
      secret: ${AGENTHUB_JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}

github:
  api:
    base-url: "https://api.github.com"
    token: "${GITHUB_TOKEN:}"
    version: "2022-11-28"
  sync:
    enabled: true
    cron: "0 0 3 * * *"
    max-repositories-per-run: 100
    readme-max-length: 100000
    search-sort: "stars"
    search-order: "desc"
    min-stars: 20
    retry-count: 2
    seed-repositories:
      - "openai/openai-agents-python"
      - "langchain-ai/langchain"
      - "langchain-ai/langgraph"
      - "run-llama/llama_index"
      - "crewAIInc/crewAI"
      - "microsoft/autogen"
      - "agno-agi/agno"
      - "pydantic/pydantic-ai"
      - "stanfordnlp/dspy"
      - "microsoft/semantic-kernel"
      - "mem0ai/mem0"
      - "vllm-project/vllm"
      - "huggingface/transformers"
      - "huggingface/diffusers"
      - "sgl-project/sglang"
      - "infiniflow/ragflow"
      - "modelcontextprotocol/python-sdk"
      - "modelcontextprotocol/servers"
    queries:
      - 'topic:ai-agent stars:>20'
      - 'topic:llm stars:>20'
      - 'topic:rag stars:>20'
      - 'topic:model-context-protocol stars:>20'
      - '"agent framework" in:name,description,readme stars:>20'
      - '"autonomous agent" in:name,description,readme stars:>20'
      - '"multi-agent" in:name,description,readme stars:>20'
      - '"retrieval augmented generation" in:name,description,readme stars:>20'
      - '"llm application" in:name,description,readme stars:>20'

agent:
  score-threshold: 12

agenttrace:
  summary:
    base-url: "${AGENTTRACE_BASE_URL:http://localhost:8000}"
