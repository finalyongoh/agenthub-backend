name: Deploy AgentHub

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [agenttrace-updated]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository_owner == 'finalyongoh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: agenthub-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: finalyongoh/agenthub-frontend
          ref: main
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: agenthub-frontend

      - name: Checkout AgentTrace
        uses: actions/checkout@v4
        with:
          repository: finalyongoh/agenttrace
          ref: main
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: agenttrace

      - name: Build backend
        working-directory: agenthub-backend
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon

      - name: Build frontend
        working-directory: agenthub-frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir -p bundle
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.gradle' \
            --exclude 'build' \
            --exclude 'docker_data' \
            agenthub-backend bundle/
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            agenthub-frontend bundle/
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'data' \
            agenttrace bundle/
          cp agenthub-backend/deploy/docker-compose.prod.yml bundle/docker-compose.prod.yml

      - name: Upload bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "bundle/*"
          target: ${{ secrets.DEPLOY_PATH }}-incoming-${{ github.run_id }}
          strip_components: 1
          rm: true

      - name: Restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -eu
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            INCOMING_PATH="${{ secrets.DEPLOY_PATH }}-incoming-${{ github.run_id }}"
            (
              flock -w 600 9
              mkdir -p "$DEPLOY_PATH"
              rm -rf \
                "$DEPLOY_PATH/agenthub-backend" \
                "$DEPLOY_PATH/agenthub-frontend" \
                "$DEPLOY_PATH/agenttrace" \
                "$DEPLOY_PATH/docker-compose.prod.yml"
              cp -a "$INCOMING_PATH"/. "$DEPLOY_PATH"/
              rm -rf "$INCOMING_PATH"
              cd "$DEPLOY_PATH"
              if [ -f .env ]; then
                set -a
                . ./.env
                set +a
              fi
              GOOGLE_CLIENT_ID_FROM_SECRET='${{ secrets.GOOGLE_CLIENT_ID }}'
              GOOGLE_CLIENT_SECRET_FROM_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'
              GITHUB_CLIENT_ID_FROM_SECRET='${{ secrets.OAUTH_GITHUB_CLIENT_ID }}'
              GITHUB_CLIENT_SECRET_FROM_SECRET='${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}'
              GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID_FROM_SECRET:-${GOOGLE_CLIENT_ID:-}}"
              GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET_FROM_SECRET:-${GOOGLE_CLIENT_SECRET:-}}"
              GITHUB_CLIENT_ID="${GITHUB_CLIENT_ID_FROM_SECRET:-${GITHUB_CLIENT_ID:-}}"
              GITHUB_CLIENT_SECRET="${GITHUB_CLIENT_SECRET_FROM_SECRET:-${GITHUB_CLIENT_SECRET:-}}"
              {
                printf 'POSTGRES_PASSWORD=%s\n' '${{ secrets.POSTGRES_PASSWORD }}'
                printf 'AGENTHUB_JWT_SECRET=%s\n' '${{ secrets.AGENTHUB_JWT_SECRET }}'
                printf 'GITHUB_TOKEN_FOR_APP=%s\n' '${{ secrets.APP_GITHUB_TOKEN }}'
                printf 'GMS_API_KEY=%s\n' '${{ secrets.GMS_API_KEY }}'
                if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ] && [ -n "$GITHUB_CLIENT_ID" ] && [ -n "$GITHUB_CLIENT_SECRET" ]; then
                  printf 'SPRING_PROFILES_ACTIVE=%s\n' 'prod,oauth'
                  printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
                  printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
                  printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID"
                  printf 'GITHUB_CLIENT_SECRET=%s\n' "$GITHUB_CLIENT_SECRET"
                else
                  printf 'SPRING_PROFILES_ACTIVE=%s\n' 'prod'
                fi
              } > .env
              docker compose -f docker-compose.prod.yml up -d --build agenthub-postgres agenthub-redis agenttrace agenthub-backend
              for attempt in $(seq 1 30); do
                backend_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' agenthub-backend 2>/dev/null || true)"
                agenttrace_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' agenttrace 2>/dev/null || true)"
                if [ "$backend_health" = "healthy" ] && [ "$agenttrace_health" = "healthy" ]; then
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  docker compose -f docker-compose.prod.yml ps
                  docker logs --tail 100 agenthub-backend || true
                  docker logs --tail 100 agenttrace || true
                  exit 1
                fi
                sleep 5
              done
              docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps agenthub-frontend
              for attempt in $(seq 1 12); do
                frontend_status="$(docker inspect -f '{{.State.Status}}' agenthub-frontend 2>/dev/null || true)"
                if [ "$frontend_status" = "running" ]; then
                  break
                fi
                if [ "$attempt" -eq 12 ]; then
                  docker logs --tail 100 agenthub-frontend || true
                  exit 1
                fi
                sleep 5
              done
              docker compose -f docker-compose.prod.yml ps
              docker image prune -f
            ) 9>/tmp/agenthub-deploy.lock
